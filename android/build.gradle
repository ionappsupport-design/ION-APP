// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

allprojects {
    afterEvaluate { project ->
        if (project.name == 'capacitor-community-admob') {
            project.tasks.matching { it.name.startsWith("compile") }.configureEach { compileTask ->
                compileTask.doFirst {
                    def patchSrc = new File(rootProject.projectDir, "patches/BannerExecutor.java")
                    def dest = new File(project.projectDir, "src/main/java/com/getcapacitor/community/admob/banner/BannerExecutor.java")
                    if (patchSrc.exists() && dest.parentFile.exists()) {
                        dest.text = patchSrc.text
                    }
                }
            }
        }
    }
}

